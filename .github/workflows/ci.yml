name: Build and Release CV

on:
  push:
    branches:
      - main # Triggers on every push to the main branch

permissions:
  contents: write # Required to create tags and releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv.tex # Ensure this matches your .tex file name

      - name: Upload PDF to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: siddhuw-info
          R2_OBJECT_KEY: siddhu_warrier_cv.pdf
        run: python tools/ci/upload_cv_to_cloudflare.py

      - name: Create Tag and Release
        uses: softprops/action-gh-release@v2
        with:
          # Automatically creates a tag like v42 based on the workflow run count
          tag_name: v${{ github.run_number }}
          files: cv.pdf
          body: "Automated CV update from commit ${{ github.sha }}"
          generate_release_notes: true # Auto-summarises your commit messages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
